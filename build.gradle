plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'io.github.hhhjbot'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 지시 영속화. 버전을 적지 않는 것은 Spring Boot 플러그인이
    // 3.3.5에 맞는 Hibernate·H2 버전을 골라 주기 때문이다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 소스 파일은 UTF-8이다. JDK 17은 Windows에서 기본 인코딩이 CP949라
// 지정하지 않으면 javac가 UTF-8 소스를 CP949로 읽어 한글 문자열이 깨진다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 테스트를 실행하는 JVM의 출력도 UTF-8로 맞춘다.
tasks.withType(Test).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()

    // 어떤 테스트가 통과했는지 콘솔에 표시한다.
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}

// 애플리케이션도 UTF-8로 띄운다. 콘솔 로그의 한글이 깨지지 않게 한다.
tasks.named('bootRun') {
    jvmArgs '-Dfile.encoding=UTF-8'
}
